<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="600" height="400" fill="#f8f9fa"/>
    
    <!-- Title -->
    <text x="300" y="40" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Docker Container Setup</text>
    
    <!-- Host System -->
    <rect x="50" y="80" width="500" height="40" rx="5" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="300" y="105" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Raspberry Pi Host</text>
    
    <!-- Docker Container -->
    <rect x="100" y="140" width="400" height="200" rx="5" fill="#e9ecef" stroke="#333" stroke-width="2"/>
    <text x="300" y="170" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Docker Container</text>
    
    <!-- Container Contents -->
    <rect x="120" y="190" width="360" height="30" rx="5" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="140" y="210" font-family="Arial" font-size="14" fill="#333">Ruby 3.2 Base Image</text>
    
    <rect x="120" y="230" width="360" height="30" rx="5" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="140" y="250" font-family="Arial" font-size="14" fill="#333">Jekyll & Bundler</text>
    
    <rect x="120" y="270" width="360" height="30" rx="5" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="140" y="290" font-family="Arial" font-size="14" fill="#333">Site Files</text>
    
    <!-- Port Mapping -->
    <path d="M500 240 L550 240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="525" y="230" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Port 4000</text>
    
    <!-- Arrowhead definition -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
        </marker>
    </defs>
</svg> 